<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOOGOS | India's First Hypercar</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@300;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:'Inter',sans-serif}
nav{position:fixed;top:0;width:100%;z-index:99;background:rgba(0,0,0,0.95);backdrop-filter:blur(10px);padding:12px 40px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a1a1a}
.logo-img{height:42px}
.menu{display:flex;gap:30px;list-style:none;font-family:'Orbitron';font-size:10px;letter-spacing:2.5px}
.menu a{color:#888;text-decoration:none;transition:0.3s}
.menu a:hover{color:#fff}
.hero{padding-top:110px;min-height:100vh;display:flex;flex-direction:column;align-items:center;text-align:center;background:radial-gradient(circle at 50% 0%, #1e1e1e 0%, #000 65%)}
.hero h1{font-family:'Orbitron';font-size:clamp(50px,9vw,110px);font-weight:900;line-height:0.85;letter-spacing:-2px;margin:20px 0}
.hero h1 span{color:#555}
.sub{color:#888;letter-spacing:6px;font-size:11px;text-transform:uppercase;margin-bottom:50px;font-family:'Orbitron'}
.poster-wrap{width:100%;max-width:1050px;margin:0 auto;padding:0 20px}
.poster-wrap img{width:100%;border:1px solid #1a1a1a;box-shadow:0 0 100px rgba(255,255,255,0.08)}
.btn{margin-top:50px;padding:20px 60px;background:#fff;color:#000;font-family:'Orbitron';font-weight:700;font-size:11px;letter-spacing:3px;text-decoration:none;display:inline-block;transition:0.3s}
.btn:hover{background:transparent;color:#fff;border:1px solid #fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #1a1a1a;border-bottom:1px solid #1a1a1a;margin-top:80px;width:100%}
.stat{padding:45px 20px;text-align:center;border-right:1px solid #1a1a1a}
.stat:last-child{border:none}
.stat h2{font-family:'Orbitron';font-size:36px;letter-spacing:-1px}
.stat p{color:#555;font-size:9px;letter-spacing:3px;margin-top:10px;text-transform:uppercase;font-family:'Orbitron'}
footer{padding:40px;text-align:center;color:#333;font-size:10px;letter-spacing:2px;font-family:'Orbitron'}
@media(max-width:768px){.stats{grid-template-columns:1fr 1fr}.stat{border-bottom:1px solid #1a1a1a} nav{padding:12px 20px} .logo-img{height:34px}}
</style>
</head>
<body>
<nav>
<img src="logo.png" class="logo-img" alt="BOOGOS">
<ul class="menu"><li><a href="#">B 001</a></li><li><a href="#">SPECIFICATIONS</a></li><li><a href="#">CONTACT</a></li></ul>
</nav>

<section class="hero">
<p class="sub">Engineering The Future</p>
<h1>BOOGOS<br><span>B 001</span></h1>
<p class="sub" style="margin-top:15px; color:#555;">India's First Hypercar</p>

<div class="poster-wrap">
<img src="poster.jpg" alt="BOOGOS B 001">
</div>

<a href="#" class="btn">DISCOVER B 001</a>

<div class="stats">
<div class="stat"><h2>2200</h2><p>Horsepower</p></div>
<div class="stat"><h2>2000</h2><p>Nm Torque</p></div>
<div class="stat"><h2>2.1s</h2><p>0-100 km/h</p></div>
<div class="stat"><h2>500+</h2><p>Top Speed</p></div>
</div>

<footer>© 2026 BOOGOS AUTOMOTIVE. BORN ON TRACK. BUILT FOR LEGENDS.</footer>
</section>
</body>
</html>
