<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOOGOS | India's First 4K Chrome Hypercar</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family: 'Segoe UI', Arial, sans-serif;overflow-x:hidden}
.header{position:fixed;top:0;width:100%;display:flex;justify-content:space-between;align-items:center;padding:18px 35px;background:rgba(0,0,0,0.9);backdrop-filter:blur(10px);border-bottom:1px solid #111;z-index:100}
.logo{font-size:32px;font-weight:900;letter-spacing:6px;background:linear-gradient(180deg,#fff 0%,#aaa 50%,#fff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 10px rgba(255,255,255,0.5))}
.hero{min-height:100vh;display:flex;align-items:center;padding:100px 40px;gap:40px}
.hero-left{flex:1}
.hero-left h1{font-size:68px;line-height:0.9;letter-spacing:3px;font-weight:900}
.hero-left h1 span{color:#444}
.hero-left p{color:#666;margin-top:20px;letter-spacing:4px;font-size:12px}
.btn{margin-top:35px;display:inline-flex;align-items:center;gap:12px;background:#fff;color:#000;padding:16px 32px;text-decoration:none;font-weight:800;letter-spacing:2px;font-size:13px;transition:0.3s}
.btn:hover{background:#ccc;transform:scale(1.05)}
.hero-right{flex:1.2;position:relative}
.hero-right img{width:100%;border-radius:2px;filter:contrast(1.1) brightness(1.05);box-shadow:0 20px 60px rgba(255,255,255,0.1)}
.blueprint{background:#05080e;padding:70px 30px;text-align:center;border-top:1px solid #0f1a25;border-bottom:1px solid #0f1a25}
.blueprint h2{letter-spacing:8px;font-size:20px}
.blue-grid{max-width:1100px;margin:40px auto 0;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#112233}
.blue-box{background:#080f18;padding:35px 20px}
.blue-box div{font-size:11px;letter-spacing:3px;color:#4a6a8a;margin-top:12px}
.footer{text-align:center;padding:30px;color:#222;font-size:10px;letter-spacing:4px}
@media(max-width:900px){.hero{flex-direction:column;padding:100px 20px 30px}.hero-left h1{font-size:42px}.blue-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div class="header">
<div class="logo">BOOGOS</div>
<div style="font-size:10px;letter-spacing:5px;color:#555">MOTORSPORT</div>
</div>
