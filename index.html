<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOOGOS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000}
.top{position:absolute;top:0;width:100%;display:flex;justify-content:space-between;padding:18px 20px;z-index:10;color:#fff}
.top b{letter-spacing:5px}
.hero{height:90vh;position:relative}
.hero img{width:100%;height:100%;object-fit:cover}
.text{position:absolute;bottom:90px;left:20px;color:#fff}
.text h1{font-size:52px;font-weight:300;line-height:1}
.text p{margin-top:10px;font-size:14px;color:#ddd}
.text button{margin-top:20px;width:92%;padding:16px;background:transparent;border:1px solid #fff;color:#fff;font-size:16px}
.chip{position:absolute;top:80px;left:50%;transform:translateX(-50%);text-align:center}
.chip span{font-size:10px;letter-spacing:4px;color:#00ffff;display:block}
.chip h1{font-size:38px;font-weight:900;letter-spacing:6px;background:linear-gradient(90deg,#00ffff,#ff00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.white{background:#fff;text-align:center;padding:40px 20px}
.white h2{font-size:30px;font-weight:300}
.white .car{font-size:60px;margin:20px}
.white button{width:90%;padding:15px;border:1px solid #000;background:#fff;margin-top:15px}
</style>
</head>
<body>
<div class="top"><b>BOOGOS</b><span>☰</span></div>
<div class="hero">
<img src="IMG-20260827-WA6748.jpg" alt="BOOGOS">
<div class="chip"><span>INDIA'S FIRST 4K CHROME BRAND</span><h1>BOOGOS</h1></div>
<div class="text">
<h1>The new<br>BOOGOS<br>DROP</h1>
<p>Price starting at ₹4,990*</p>
<button>Know more</button>
</div>
</div>
<div class="white">
<h2>Find your BOOGOS.</h2>
<div class="car">✨</div>
<p>Find a new drop</p>
<button>Search now</button>
</div>
</body>
</html>
