<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOOGOS | India's First Hypercar</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@300;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:'Inter',sans-serif}
nav{position:fixed;top:0;width:100%;z-index:99;background:rgba(0,0,0,0.9);backdrop-filter:blur(10px);padding:12px 30px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
.logo-img{height:50px}
.menu{display:flex;gap:25px;list-style:none;font-family:'Orbitron';font-size:10px;letter-spacing:2px}
.menu a{color:#999;text-decoration:none}
.hero{padding-top:100px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 0%, #222 0%, #000 60%)}
.hero h1{font-family:'Orbitron';font-size:clamp(40px,8vw,100px);font-weight:900;line-height:0.9;margin:20px 0}
.hero h1 span{color:#888}
.tagline{font-family:'Orbitron';color:#fff;letter-spacing:3px;font-size:14px;margin-bottom:10px}
.sub{color:#666;letter-spacing:4px;font-size:11px;text-transform:uppercase;margin-bottom:40px}
.poster-wrap{width:100%;max-width:1100px;margin:0 auto;padding:20px}
.poster-wrap img{width:100%;border:1px solid #222;box-shadow:0 0 80px rgba(255,255,255,0.1)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #222;border-bottom:1px solid #222;margin-top:40px}
.stat{padding:40px 20px;text-align:center;border-right:1px solid #222}
.stat:last-child{border:none}
.stat h2{font-family:'Orbitron';font-size:32px}
.stat p{color:#666;font-size:10px;letter-spacing:2px;margin-top:8px;text-transform:uppercase}
.btn{margin-top:30px;padding:18px 50px;background:#fff;color:#000;font-family:'Orbitron';font-weight:700;font-size:12px;letter-spacing:2px;text-decoration:none;display:inline-block}
.btn:hover{background:#000;color:#fff;border:1px solid #fff}
@media(max-width:768px){.stats{grid-template-columns:1fr 1fr}.logo-img{height:40px}}
</style>
</head>
<body>
<nav>
<img src="logo.png" class="logo-img" alt="BOOGOS">
<ul class="menu"><li><a href="#">B 001</a></li><li><a href="#">SPECS</a></li><li><a href="#">CONTACT</a></li></ul>
</nav>

<section class="hero">
<p class="tagline">Chai se karenge sabka swagat ☕</p>
<h1>BOOGOS<br><span>B 001</span></h1>
<p class="sub">India's First Hypercar - 2200 HP</p>

<div class="poster-wrap">
<img src="poster.jpg" alt="BOOGOS B 001 Poster">
</div>

<a href="#" class="btn">BOOK YOUR BEAST</a>

<div class="stats">
<div class="stat"><h2>2200</h2><p>Horsepower</p></div>
<div class="stat"><h2>2000</h2><p>Nm Torque</p></div>
<div class="stat"><h2>2.1s</h2><p>0-100 km/h</p></div>
<div class="stat"><h2>500+</h2><p>Top Speed km/h</p></div>
</div>
</section>
</body>
</html>
